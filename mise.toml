[tools]
typst = "0.15.1"
poppler = "26.09.0"

[env]
TYPST_FONT_PATHS = "{{config_root}}/fonts"

# Each PDF's creation timestamp comes from the source's modification time when
# the source differs from HEAD. Once committed, rebuilding reuses the date
# stored in the committed PDF, so an unchanged source gives a byte-identical
# PDF even after checkouts or rebases, which reset modification times. The
# pre-commit hook (.githooks/pre-commit) runs this task, so the PDF committed
# with a source is always the final one.
[tasks.pdf]
description = "Regenerate the PDFs from the Typst sources (all of them, or the files given)"
dir = "{{cwd}}"
usage = 'arg "[file]" var=#true help="Typst sources to compile; all of them when omitted"'
run = '''
set -e
timestamp() {
  pdf=${1%.typ}.pdf
  if git diff --quiet HEAD -- "$1" 2>/dev/null &&
    git cat-file -e "HEAD:./${pdf#./}" 2>/dev/null; then
    tmp=$(mktemp)
    git show "HEAD:./${pdf#./}" > "$tmp"
    d=$(pdfinfo -isodates "$tmp" | sed -n 's/^CreationDate: *//p')
    rm -f "$tmp"
    if [ -n "$d" ]; then
      date -d "$d" +%s
      return
    fi
  fi
  date -r "$1" +%s
}
if [ -n "${usage_file:-}" ]; then
  printf '%s\n' $usage_file
else
  find . -name '*.typ' -not -path './.git/*'
fi | while read -r f; do
  echo "$f"
  typst compile --creation-timestamp "$(timestamp "$f")" "$f"
done
'''

# For drafting: recompiles on every change to the sources or their
# dependencies. The PDFs get the compile time as timestamp; the pre-commit
# hook rebuilds them with the `pdf` task when committing.
[tasks.watch]
description = "Recompile the given Typst sources whenever they change"
dir = "{{cwd}}"
usage = 'arg "<file>" var=#true help="Typst sources to watch"'
run = '''
# Background jobs ignore Ctrl-C in a non-interactive shell, so stop them on exit.
pids=
trap 'kill $pids 2>/dev/null' EXIT
trap 'exit 130' INT TERM
for f in $usage_file; do
  typst watch "$f" &
  pids="$pids $!"
done
wait
'''
